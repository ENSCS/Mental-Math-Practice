<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Math Game ฝึกคิดเลข</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Edu+SA+Beginner:wght@400..700&family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #121212;
      --box-bg: #1e1e1e;
      --text-color: #ffffff;
      --input-bg: #333;
      --border-color: #555;
      --keypad-bg: #2c2c2c;
      --button-gray: #757575;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Sarabun', sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .box {
      background: var(--box-bg);
      width: 100%;
      max-width: 600px;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    #gameBox {
      background: var(--box-bg);
      width: 100%;
      max-width: 360px;
      padding: 10px;
      border-radius: 16px;
      box-shadow: 0 0 10px rgba(0, 0, 0, 0.5);
      text-align: center;
    }

    .timer {
      font-size: 1.2rem;
      color: #f44336;
      margin-bottom: 10px;
    }

    /* ปรับแต่งส่วนแสดงโจทย์แนวตั้ง */
    .problem {
      font-size: 2.0rem;
      font-family: 'Edu SA Beginner', 'Sarabun', sans-serif, Arial, Helvetica ;
      letter-spacing: 8px;
      margin-bottom: 10px;
      display: flex;
      flex-direction: column;
      align-items: flex-end; /* ชิดขวาเพื่อให้หลักตรงกัน */
      padding: 0 20% 10px 0; /* เว้นระยะด้านขวาเพื่อให้ดูสมดุล */
      border-bottom: 2px solid var(--border-color);
      line-height: 1.15;
      font-weight: 400;
    }

    .problem div {
      width: 100%;
      text-align: right;
    }

    .problem .minus-num {
      color: #fff; /* ไฮไลท์ตัวเลขติดลบ */
    }

    .question-number {
      font-size: 1.2rem;
      color: #64b5f6;
      margin-bottom: 5px;
    }

    #answer {
      font-size: 1.5rem;
      width: 80%;
      text-align: center;
      padding: 8px;
      margin-top: 5px; /* เพิ่มระยะห่างจากเส้นใต้โจทย์ */
      margin-bottom: 5px;
      background-color: var(--input-bg);
      border: 2px solid var(--border-color);
      border-radius: 10px;
      color: var(--text-color);
      transition: all 0.3s ease-in-out;
    }

    #answer.correct {
      border: 2px solid green;
      color: lightgreen;
    }

    #answer.incorrect {
      border: 2px solid red;
      color: pink;
    }

    .keypad {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      margin-bottom: 8px;
    }

    .keypad button {
      font-size: 1.5rem;
      padding: 8px 0;
      border-radius: 10px;
      border: none;
      background-color: var(--keypad-bg);
      color: var(--text-color);
      cursor: pointer;
    }

    button.action {
      background-color: #ffab91;
    }

    button.enter {
      background-color: #388e3c;
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 15px;
      margin-top: 10px;
    }

    .big-button {
      font-size: 1.3rem;
      padding: 8px;
      border-radius: 10px;
      cursor: pointer;
      border: none;
      color: white;
      width: 100%;
      box-shadow: 0 4px 6px rgba(0, 0, 0, 0.2);
    }

    .plus-button {
      background-color: #4CAF50;
    }

    .plus-button:hover {
      background-color: #388e3c;
    }

    .minus-button {
      background-color: #ff9800;
    }

    .minus-button:hover {
      background-color: #f57c00;
    }

    .mix-button {
      background-color: #2196F3;
    }

    .mix-button:hover {
      background-color: #1976d2;
    }

    .gray-button {
      background-color: var(--button-gray);
    }

    .gray-button:hover {
      background-color: #616161;
    }

    .selection {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 15px;
      margin-top: 10px;
    }

    .config-row {
      display: flex;
      gap: 20px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .config-select {
      flex: 1;
      font-size: 1.1rem;
      color: #fff;
    }

    .config-select select {
      width: 100%;
      padding: 10px 14px;
      font-size: 1rem;
      background-color: #2c2c2c;
      color: #ffffff;
      border: 1px solid #555;
      border-radius: 8px;
      outline: none;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .config-select select:focus {
      border-color: #64b5f6;
      box-shadow: 0 0 5px rgba(100, 181, 246, 0.5);
    }



    .result {
      font-size: 1.0rem;
      margin-top: 8px;
      margin-bottom: 8px;
      min-height: 1.1em;
    }

    .result-summary {
      background-color: #1a1a1a;
      padding: 30px 20px;
      text-align: center;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.05);
    }

    .result-title {
      font-size: 2rem;
      margin-bottom: 24px;
      color: #00e676;
    }

    .result-metrics {
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-bottom: 30px;
    }

    .metric {
      background-color: #262626;
      padding: 20px 30px;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.3rem;
      color: #fff;
      border: 1px solid #333;
    }

    .metric .label {
      color: #90caf9;
    }

    .metric .value {
      font-weight: bold;
      font-size: 1.6rem;
      color: #ffffff;
      margin-right: 10px;
    }

    .result-summary.low {
      background-color: #e63946;
      /* แดงเข้ม */
    }

    .result-summary.medium {
      background-color: #1e1e1e;
      /* สีพื้นปกติ */
    }

    .result-summary.high {
      background: linear-gradient(225deg, #283c86, #45a247);
      /* เขียวเข้ม */
    }

    .result-summary.perfect {
      background: linear-gradient(90deg,
          #e81416, #ffa500, #faeb36,
          #79c314, #487de7, #4b369d, #70369d);
      background-size: 200% 200%;
      animation: pulseRainbow 3s ease-in-out infinite;
      color: #111;
    }

    @keyframes pulseRainbow {

      0%,
      100% {
        background-position: 0% 50%;
        opacity: 1;
      }

      50% {
        background-position: 100% 50%;
        opacity: 0.6;
      }
    }

    @media (min-width: 768px) {
      .problem {
        font-size: 3rem;
        padding: 0 30% 10px 0;
      }

      #answer {
        font-size: 2.5rem;
      }

      .box {
        max-width: 700px;
      }
    }

    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0px;
    }

    .status-bar .question-number {
      font-size: 1.0rem;
      color: #64b5f6;
    }

    .status-bar .timer {
      font-size: 1.0rem;
      color: #f44336;
    }

    .progress-bar {
      height: 10px;
      background-color: #555;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 20px;
      margin-bottom: 10px;
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background-color: #64b5f6;
      transition: width 0.4s ease-in-out;
    }

    .summary-details {
      display: flex;
      justify-content: space-between;
      padding: 0 16px;
      margin-bottom: 16px;
      font-size: 1.2rem;
      color: #ffffff;
    }

    .summary-details .left {
      text-align: left;
      margin-left: 10px;
    }

    .summary-details .right {
      text-align: right;
      padding-right: 24px;
    }
  </style>
</head>

<body>
  <div class="box" id="setupBox">
    <h2>เลือกรูปแบบโจทย์</h2>
    <div class="config-row">
      <label class="config-select">
        จำนวนข้อ :
        <select id="totalQuestions">
          <option value="5">5 ข้อ</option>
          <option value="10">10 ข้อ</option>
          <option value="20">20 ข้อ</option>
          <option value="50">50 ข้อ</option>
          <option value="100" selected>100 ข้อ</option>
          <option value="200">200 ข้อ</option>
        </select>
      </label>
      <label class="config-select">
        ระดับความยาก :
        <select id="difficultyFormula">
          <option value="1">ง่าย ⭐</option>
          <option value="2">ปานกลาง ⭐⭐</option>
          <option value="3" selected>ยาก ⭐⭐⭐</option>
        </select>
      </label>
    </div>

    <div class="selection">
      <button class="big-button mix-button" onclick="startGame('mix2')">➕➖ คละ 2 จำนวน</button>
      <button class="big-button mix-button" onclick="startGame('mix3')">➕➖ คละ 3 จำนวน</button>
      <button class="big-button mix-button" onclick="startGame('mix4')">➕➖ คละ 4 จำนวน</button>
      <button class="big-button mix-button" onclick="startGame('mix5')">➕➖ คละ 5 จำนวน</button>
      <button class="big-button plus-button" onclick="startGame('plus2')">➕ บวก 2 จำนวน</button>
      <button class="big-button plus-button" onclick="startGame('plus3')">➕ บวก 3 จำนวน</button>
      <button class="big-button plus-button" onclick="startGame('plus4')">➕ บวก 4 จำนวน</button>
      <button class="big-button plus-button" onclick="startGame('plus5')">➕ บวก 5 จำนวน</button>
      <button class="big-button minus-button" onclick="startGame('minus2')">➖ ลบ 2 จำนวน</button>
      <button class="big-button minus-button" onclick="startGame('minus3')">➖ ลบ 3 จำนวน</button>
      <button class="big-button minus-button" onclick="startGame('minus4')">➖ ลบ 4 จำนวน</button>
      <button class="big-button minus-button" onclick="startGame('minus5')">➖ ลบ 5 จำนวน</button>
    </div>
  </div>

  <div class="box" id="gameBox" style="display: none;">
    <div class="status-bar">
      <div class="question-number" id="questionNumber"></div>
      <div class="timer" id="timerDisplay">⏱️ 00:00</div>
    </div>
    <div class="problem" id="problem"></div>
    <input type="text" id="answer" readonly />
    <div class="result" id="result"></div>
    <div class="keypad">
      <button onclick="pressKey('1')">1</button>
      <button onclick="pressKey('2')">2</button>
      <button onclick="pressKey('3')">3</button>
      <button onclick="pressKey('4')">4</button>
      <button onclick="pressKey('5')">5</button>
      <button onclick="pressKey('6')">6</button>
      <button onclick="pressKey('7')">7</button>
      <button onclick="pressKey('8')">8</button>
      <button onclick="pressKey('9')">9</button>
      <button class="action" onclick="clearAnswer()">C</button>
      <button onclick="pressKey('0')">0</button>
      <button class="enter" onclick="checkAnswerAutoNext()">⏎</button>
    </div>
    <div class="progress-bar">
      <div class="progress-fill" id="progressFill"></div>
    </div>

  </div>

  <div class="box result-summary" id="resultBox" style="display: none;">
    <h2 class="result-title">🎉 สรุปผลลัพธ์ !</h2>
    <div id="summaryDetails" class="summary-details">
      <span class="left" id="summaryLeft">โจทย์ : บวก 2 จำนวน</span>
      <span class="right" id="summaryRight">ระดับความยาก : ⭐</span>
    </div>
    <div class="result-metrics">
      <div class="metric">
        <span class="label">คะแนนรวม</span>
        <span class="value" id="finalScore">-- / --</span>
      </div>
      <div class="metric">
        <span class="label">เวลาใช้ไป</span>
        <span class="value" id="finalTime">--:--</span>
      </div>
      <div class="metric">
        <span class="label">ความแม่นยำ</span>
        <span class="value" id="finalPercent">--%</span>
      </div>
    </div>
    <button class="big-button gray-button" onclick="goToStart()">🔄 เริ่มใหม่</button>
  </div>


  <script>
    let mode = "";
    let selectedDifficultyLabel = "";
    let numbers = [];
    let operators = [];
    let score = 0;
    let total = 0;
    let count = 0;
    let startTime;
    let timerInterval;
    let preparedProblems = [];
    let difficultyRatio = { easy: 1, medium: 0, hard: 0 };

    function classifyMultiNumberDifficulty(numbers, operators) {
      const hasCarry = numbers.some(n => n % 10 > 5);
      const total = numbers.reduce((a, b, i) => i === 0 ? b : (operators[i - 1] === '+' ? a + b : a - b), 0);
      const max = Math.max(...numbers);

      if (max <= 30 && !hasCarry) return "ง่าย";
      if (max <= 60) return "ปานกลาง";
      return "ยาก";
    }

    document.addEventListener("keydown", (e) => {
      const gameBoxVisible = document.getElementById("gameBox").style.display !== "none";
      if (!gameBoxVisible) return;

      if (e.key >= "0" && e.key <= "9") {
        pressKey(e.key);
      } else if (e.key === "Backspace") {
        e.preventDefault();
        backspace();
      } else if (e.key === "Enter") {
        e.preventDefault();
        checkAnswerAutoNext();
      } else if (e.key === "c" || e.key === "C") {
        clearAnswer();
      }
    });

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
    }


    function generateProblemsWithDifficulty(total) {
      const targetEasy = Math.round(total * difficultyRatio.easy);
      const targetMedium = Math.round(total * difficultyRatio.medium);
      const targetHard = total - targetEasy - targetMedium;

      const counters = { easy: 0, medium: 0, hard: 0 };
      const problems = [];

      while (problems.length < total) {
        const countNum = parseInt(mode.replace(/[^0-9]/g, ''));
        const numbers = Array.from({ length: countNum }, () => Math.floor(Math.random() * 90) + 1);
        const operators = [];

        if (mode.startsWith("plus")) {
          operators.push(...Array(countNum - 1).fill("+"));
        } else if (mode.startsWith("minus")) {
          operators.push(...Array(countNum - 1).fill("-"));
        } else {
          for (let i = 0; i < countNum - 1; i++) {
            operators.push(Math.random() < 0.5 ? "+" : "-");
          }
        }

        let result = numbers[0];
        for (let i = 0; i < operators.length; i++) {
          result = operators[i] === "+" ? result + numbers[i + 1] : result - numbers[i + 1];
        }

        if (result < 0) continue;

        const level = classifyMultiNumberDifficulty(numbers, operators);
        if ((level === "ง่าย" && counters.easy < targetEasy) ||
          (level === "ปานกลาง" && counters.medium < targetMedium) ||
          (level === "ยาก" && counters.hard < targetHard)) {
          problems.push({ numbers, operators, difficulty: level });
          counters[level === "ง่าย" ? "easy" : level === "ปานกลาง" ? "medium" : "hard"]++;
        }
      }
      shuffle(problems);
      return problems;
    }

    function startGame(selectedMode) {
      mode = selectedMode;
      score = 0;
      count = 0;
      total = parseInt(document.getElementById("totalQuestions").value);
      const selectedFormula = document.getElementById("difficultyFormula").value;
      if (selectedFormula === "1") {
        difficultyRatio = { easy: 0.7, medium: 0.2, hard: 0.1 };
        selectedDifficultyLabel = "⭐";
      } else if (selectedFormula === "2") {
        difficultyRatio = { easy: 0.4, medium: 0.4, hard: 0.2 };
        selectedDifficultyLabel = "⭐⭐";
      } else if (selectedFormula === "3") {
        difficultyRatio = { easy: 0.1, medium: 0.2, hard: 0.7 };
        selectedDifficultyLabel = "⭐⭐⭐";
      }

      startTime = new Date();
      startTimer();
      document.getElementById("setupBox").style.display = "none";
      document.getElementById("gameBox").style.display = "block";
      preparedProblems = generateProblemsWithDifficulty(total);
      setTimeout(() => newProblem(), 100);
    }

    function newProblem() {
      if (count >= total) {
        stopTimer();
        const timeTaken = Math.floor((new Date() - startTime) / 1000);
        const percent = Math.round((score / total) * 100);
        const min = Math.floor(timeTaken / 60);
        const sec = timeTaken % 60;

        document.getElementById("finalScore").textContent = `${score} / ${total}`;
        document.getElementById("finalTime").textContent = `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}`;
        document.getElementById("finalPercent").textContent = `${percent}%`;

        const resultBox = document.getElementById("resultBox");
        resultBox.classList.remove("low", "medium", "high", "perfect");
        if (percent === 100) resultBox.classList.add("perfect");
        else if (percent >= 80) resultBox.classList.add("high");
        else if (percent < 50) resultBox.classList.add("low");
        else resultBox.classList.add("medium");

        document.getElementById("gameBox").style.display = "none";
        resultBox.style.display = "block";

        let description = "";
        if (mode.startsWith("plus")) description = `บวก ${mode.slice(-1)} จำนวน`;
        else if (mode.startsWith("minus")) description = `ลบ ${mode.slice(-1)} จำนวน`;
        else if (mode.startsWith("mix")) description = `คละ ${mode.slice(-1)} จำนวน`;

        document.getElementById("summaryLeft").textContent = `โจทย์ : ${description}`;
        document.getElementById("summaryRight").textContent = `ระดับความยาก : ${selectedDifficultyLabel}`;
        return;
      }

      const problem = preparedProblems[count];
      numbers = problem.numbers;
      operators = problem.operators;

      let emoji = "";
      if (problem.difficulty === "ง่าย") emoji = "⭐";
      else if (problem.difficulty === "ปานกลาง") emoji = "⭐⭐";
      else if (problem.difficulty === "ยาก") emoji = "⭐⭐⭐";

      document.getElementById("questionNumber").textContent = `ข้อที่ ${count + 1} / ${total} ${emoji}`;

      // ปรับปรุงการแสดงผลโจทย์เป็นแนวตั้งและลบเครื่องหมายบวก
      const problemDiv = document.getElementById("problem");
      problemDiv.innerHTML = ""; // ล้างค่าเก่า
      
      numbers.forEach((num, i) => {
        const numDiv = document.createElement("div");
        if (i === 0) {
          numDiv.textContent = num;
        } else {
          // ถ้าเป็นเครื่องหมายลบ ให้แสดงติดลบ ถ้าเป็นบวกให้แสดงตัวเลขเปล่าๆ
          if (operators[i-1] === "-") {
            numDiv.textContent = `-${num}`;
            numDiv.classList.add("minus-num");
          } else {
            numDiv.textContent = num;
          }
        }
        problemDiv.appendChild(numDiv);
      });

      const answerInput = document.getElementById("answer");
      answerInput.classList.remove("correct", "incorrect");
      answerInput.value = "";
      document.getElementById("result").textContent = "";

      const percentDone = Math.round(((count) / (total)) * 100);
      document.getElementById("progressFill").style.width = percentDone + "%";
      count++;
    }


    function startTimer() {
      timerInterval = setInterval(() => {
        const now = new Date();
        const elapsed = Math.floor((now - startTime) / 1000);
        const minutes = Math.floor(elapsed / 60);
        const seconds = elapsed % 60;
        document.getElementById("timerDisplay").textContent = `⏱️ ${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      }, 1000);
    }

    function stopTimer() {
      clearInterval(timerInterval);
    }

    function pressKey(val) {
      document.getElementById("answer").value += val;
    }
    function backspace() {
      let ans = document.getElementById("answer");
      ans.value = ans.value.slice(0, -1);
    }
    function clearAnswer() {
      document.getElementById("answer").value = "";
    }
    function checkAnswerAutoNext() {
      const answerInput = document.getElementById("answer");
      const resultBox = document.getElementById("result");
      const userAnswer = parseInt(answerInput.value);
      const correctAnswer = numbers.reduce((sum, n, i) => i === 0 ? n : (operators[i - 1] === "+" ? sum + n : sum - n), 0);
      answerInput.classList.remove("correct", "incorrect");
      if (isNaN(userAnswer)) {
        resultBox.textContent = "กรุณากรอกคำตอบ";
        resultBox.style.color = "orange";
        return;
      }
      if (userAnswer === correctAnswer) {
        score++;
        answerInput.classList.add("correct");
        answerInput.value = "✅ " + userAnswer;
        resultBox.textContent = "";
        setTimeout(() => {
          answerInput.classList.remove("correct");
          answerInput.value = "";
          newProblem();
        }, 700);
      } else {
        answerInput.classList.add("incorrect");
        answerInput.value = "❌ " + userAnswer;
        resultBox.textContent = `เฉลย ${correctAnswer}`;
        resultBox.style.color = "red";
        setTimeout(() => {
          answerInput.classList.remove("incorrect");
          answerInput.value = "";
          newProblem();
        }, 1000);
      }
    }

    function goToStart() {
      document.getElementById("resultBox").style.display = "none";
      document.getElementById("setupBox").style.display = "block";
    }
  </script>
</body>

</html>
