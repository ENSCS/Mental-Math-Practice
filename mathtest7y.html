<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>คณิตคิดเร็ว 7 ปี Test</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Edu+SA+Beginner:wght@400..700&family=Sarabun:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        /* ตัวเลขลายมือ 0-9 (ทำเองด้วย Calligraphr) ตัวอื่นเช่น - ใช้ Tahoma แทน */
        @font-face { font-family: 'Speednumber'; src: url('fonts/Speednumber-Regular.ttf') format('truetype'); font-display: swap; }
        @page {
            size: A4 landscape;
            margin: 5mm;
        }

        body {
            font-family: 'Sarabun', sans-serif;
            margin: 0;
            padding: 0;
            background-color: #f0f0f0;
        }

        .container {
            width: 285mm;
            margin: auto;
            background: white;
            padding: 5mm;
            box-sizing: border-box;
        }

        .section-box {
            margin-bottom: 12px;
        }

        .section-title {
            font-size: 18px;
            font-weight: bold;
            padding: 4px 10px;
            background: #fff;
            color: #545454;
            margin-bottom: 0;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(20, 1fr);
            border-left: 1px solid #000;
            border-top: 1px solid #000;
            margin-bottom: 15px;
        }

        .problem-col {
            border-right: 1px solid #000;
            border-bottom: 1px solid #000;
            display: flex;
            flex-direction: column;
            text-align: center;
            background: #fff;
        }

        .first-row {
            background-color: #aaa;
            font-size: 10px;
            border-bottom: 1px solid #000;
            padding: 1px 0;
            color: #000;
            font-family: 'Sarabun', sans-serif;
        }

        .num-area {
            padding: 4px 0;
            display: flex;
            flex-direction: column;
            line-height: 27.3px; /* ล็อกระยะบรรทัดเท่าเดิม (เดิม 1.3 ของ 21px) */
            font-size: 19px;
            font-family: 'Speednumber', Tahoma, 'Edu SA Beginner', cursive;
            font-weight: 400;
            font-style: normal;
            color: #000;
        }

        .ans-line {
            border-top: 2px solid #000;
            border-bottom: 2px solid #000;
            height: 35px;
        }

        .answer-section {
            margin-top: 20px;
            border-top: 3px double #000;
            padding-top: 15px;
        }

        .answer-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 12px;
            text-align: center;
        }

        .answer-table th, .answer-table td {
            border: 1px solid #000;
            padding: 4px;
            font-family: 'Sarabun', sans-serif;
        }

        .answer-table th { background-color: #eee; }
        .page-label { background-color: #ddd !important; font-weight: bold; width: 50px; }

        .controls { position: fixed; top: 10px; right: 10px; z-index: 100; }
        button { padding: 10px 20px; cursor: pointer; border: none; background: #e67e22; color: white; font-weight: bold; border-radius: 4px; }

        @media print {
            .controls { display: none; }
            body { background: white; }
            .container { width: 100%; padding: 0; }
            .answer-section { page-break-before: always; }
        }
    </style>
</head>
<body>

<div class="controls">
    <button onclick="window.location.reload()">สุ่มโจทย์ใหม่</button>
    <button onclick="window.print()" style="background:#2980b9;">พิมพ์ PDF</button>
</div>

<div class="container">
    <div class="section-box">
        <div id="section-title-1" class="section-title">คณิตคิดเร็ว รุ่นอายุ 7 ปี </div>
        <div id="grid1" class="grid-container"></div>
    </div>

    <div class="section-box">
        <div id="grid2" class="grid-container"></div>
    </div>

    <div class="section-box">
        <div id="grid3" class="grid-container"></div>
    </div>

    <div class="answer-section">
        <div id="answer-key-title" style="font-weight: bold; margin-bottom: 5px;">Answer Key</div>
        <table class="answer-table">
            <thead><tr id="thr-1"><th class="page-label">Page</th></tr></thead>
            <tbody>
                <tr id="row-1"><td class="page-label">1</td></tr>
                <tr id="row-2"><td class="page-label">2</td></tr>
                <tr id="row-3"><td class="page-label">3</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
    // --- ฟังก์ชันสร้าง Time Stamp และอัปเดตจุดต่างๆ ---
    function applyTimestamp() {
        const now = new Date();
        
        // 1. YY
        const yy = now.getFullYear().toString().slice(-2);

        // 2. WW (ISO Week)
        const tempDate = new Date(now.valueOf());
        tempDate.setDate(tempDate.getDate() + 4 - (tempDate.getDay() || 7));
        const yearStart = new Date(tempDate.getFullYear(), 0, 1);
        const ww = Math.ceil((((tempDate - yearStart) / 86400000) + 1) / 7).toString().padStart(2, '0');

        // 3. D (1-7)
        const dNum = now.getDay();
        const d = (dNum === 0) ? 7 : dNum;

        // 4. H (0=Z, 1=A...)
        const hour = now.getHours();
        const h = (hour === 0) ? "Z" : String.fromCharCode(64 + hour);

        // 5. MMSS
        const mm = now.getMinutes().toString().padStart(2, '0');
        const ss = now.getSeconds().toString().padStart(2, '0');

        const timestamp = `${yy}${ww}-${d}${h}-${mm}${ss}`;

        // อัปเดต Title
        document.title = `คณิตคิดเร็ว 7 ปี Test id ${timestamp}`;

        // อัปเดตหัวข้อแถวที่ 1
        const secTitle = document.getElementById('section-title-1');
        secTitle.innerText = `คณิตคิดเร็ว รุ่นอายุ 7 ปี [ Test id : ${timestamp} ] .: by ENS :. No copyright, not for commercial use`;

        // อัปเดต Answer Key Title
        const ansTitle = document.getElementById('answer-key-title');
        ansTitle.innerText = `Answer Key [ Test id : ${timestamp} ]`;
    }

    // เรียกใช้งาน Time Stamp
    applyTimestamp();

    // --- ส่วนเดิมของระบบสุ่มโจทย์ ---
    const answers = [];

    function generate(containerId, startNo, rows, maxMinus) {
        const container = document.getElementById(containerId);
        const sectionAns = [];
        
        for (let i = 0; i < 20; i++) {
            let res = -1;
            let nums = [];
            while (res < 0 || res > 59) {
                nums = [];
                let minusCount = 0;
                let curr = Math.floor(Math.random() * 9) + 1;
                nums.push(curr);
                for (let r = 1; r < rows; r++) {
                    let v = Math.floor(Math.random() * 9) + 1;
                    let m = v;
                    if (minusCount < maxMinus && Math.random() < 0.35) {
                        if (curr - v >= 0) { m = -v; minusCount++; }
                    }
                    curr += m;
                    nums.push(m);
                }
                res = curr;
            }
            sectionAns.push(res);
            const firstNum = nums.shift();
            const col = document.createElement('div');
            col.className = 'problem-col';
            col.innerHTML = `
                <div class="first-row">${startNo + i}</div>
                <div class="num-area">
                    <span>${firstNum}</span>
                    ${nums.map(n => `<span>${n < 0 ? '-' + Math.abs(n) : n}</span>`).join('')}
                </div>
                <div class="ans-line"></div>
            `;
            container.appendChild(col);
        }
        answers.push(sectionAns);
    }

    generate('grid1', 1, 5, 1);
    generate('grid2', 21, 6, 2);
    generate('grid3', 41, 7, 2);

    const thr = document.getElementById('thr-1');
    for(let i=1; i<=20; i++) {
        const th = document.createElement('th');
        th.innerText = i;
        thr.appendChild(th);
    }
    answers.forEach((group, idx) => {
        const row = document.getElementById(`row-${idx+1}`);
        group.forEach(v => {
            const td = document.createElement('td');
            td.innerText = v;
            row.appendChild(td);
        });
    });
</script>
</body>
</html>
